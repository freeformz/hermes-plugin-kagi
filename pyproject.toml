# Hermes' package manager (PM) reads [project].dependencies from this file. The plugin
# needs nothing beyond Hermes itself: it calls the Kagi API with httpx, which Hermes ships.
# An empty list counts as "no declaration", so PM leaves the shared environment alone.
[project]
name = "hermes-plugin-web-kagi"
version = "0.2.1"
description = "Kagi web search + content extraction for hermes-agent"
requires-python = ">=3.11"
dependencies = []
